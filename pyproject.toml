[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mripet"
version = "1.0.0"
description = "Image casting and fusion of MRI and PET for predicting progression from MCI to Alzheimer's disease"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Adediji Fakoya"}]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
  "SimpleITK>=2.3",
  "tensorflow>=2.16",
]

[project.optional-dependencies]
dev = ["pytest>=7", "nbformat", "nbconvert", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
